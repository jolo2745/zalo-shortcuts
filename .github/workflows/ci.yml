name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            tests/ZaloShortcuts.Tests/packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore tests/ZaloShortcuts.Tests/ZaloShortcuts.Tests.csproj --locked-mode
      - name: Build
        run: dotnet build ZaloShortcuts.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet run --project tests/ZaloShortcuts.Tests/ZaloShortcuts.Tests.csproj --configuration Release --no-restore
